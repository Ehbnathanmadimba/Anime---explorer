<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anime - explorer</title>
  </head>

  <body>
    <div id="app">
      <header id="site-header">
        <h1>Anime Explorer</h1>
        <button id="theme-button" type="button">Licht thema</button>
      </header>

      <form id="search-form">
        <label for="search-input">Zoek</label>
        <input id="search-input" type="search" placeholder="Titel van een anime" />
        <button type="submit">Zoeken</button>

        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="">Alle types</option>
          <option value="tv">TV</option>
          <option value="movie">Film</option>
          <option value="ova">OVA</option>
          <option value="special">Special</option>
        </select>

        <label for="sort-select">Sorteer op</label>
        <select id="sort-select">
          <option value="rank">Rang</option>
          <option value="score">Score</option>
          <option value="title">Titel</option>
          <option value="year">Jaar</option>
        </select>

        <p id="search-error"></p>
      </form>

      <main>
        <section id="favorites-section">
          <h2>Mijn favorieten</h2>
          <div id="favorites-list"></div>
        </section>

        <section id="results-section">
          <h2>Alle anime</h2>
          <button id="view-button" type="button">Toon als tabel</button>
          <p id="status-message"></p>
          <div id="anime-container"></div>
        </section>
      </main>

      <footer id="site-footer">
        <p>
          Data van de
          <a href="https://kitsu.docs.apiary.io/" target="_blank">Kitsu API</a>.
          Schoolproject Web Advanced Nathan Madimba.
        </p>
      </footer>

      <div id="modal" class="verborgen">
        <div id="modal-inhoud">
          <button id="modal-sluit" type="button">Sluiten</button>
          <div id="modal-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
