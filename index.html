<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anime - explorer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app">
      <header id="site-header">
        <div id="header-balk">
          <span id="logo">◈ Anime Explorer</span>
          <button id="theme-button" type="button">Licht thema</button>
        </div>

        <div id="hero">
          <h1>Anime Explorer</h1>
          <p>Ontdek, filter en bewaar je favoriete anime</p>
        </div>
      </header>

      <form id="search-form">
        <label for="search-input">Zoek</label>
        <input id="search-input" type="search" placeholder="Zoek een anime op titel..." />
        <button type="submit">Zoeken</button>
        <p id="search-error"></p>
      </form>

      <div id="filter-balk">
        <div id="filter-knoppen">
          <button type="button" class="chip actief" data-type="">Alle</button>
          <button type="button" class="chip" data-type="TV">TV</button>
          <button type="button" class="chip" data-type="movie">Film</button>
          <button type="button" class="chip" data-type="OVA">OVA</button>
          <button type="button" class="chip" data-type="ONA">ONA</button>
          <button type="button" class="chip" data-type="special">Special</button>
        </div>

        <div id="sorteer-blok">
          <label for="sort-select">Sorteer op</label>
          <select id="sort-select">
            <option value="rang">Populariteit</option>
            <option value="score-hoog">Score hoog → laag</option>
            <option value="score-laag">Score laag → hoog</option>
            <option value="titel-az">Titel A → Z</option>
            <option value="titel-za">Titel Z → A</option>
            <option value="jaar-nieuw">Jaar nieuw → oud</option>
            <option value="jaar-oud">Jaar oud → nieuw</option>
          </select>
        </div>
      </div>

      <main>
        <section id="favorites-section">
          <h2>Mijn favorieten</h2>
          <div id="favorites-list"></div>
        </section>

        <section id="results-section">
          <h2>Alle anime</h2>
          <button id="view-button" type="button">Toon als tabel</button>
          <p id="status-message"></p>
          <div id="anime-container"></div>
        </section>
      </main>

      <footer id="site-footer">
        <p>
          Data van de
          <a href="https://kitsu.docs.apiary.io/" target="_blank">Kitsu API</a>.
          Schoolproject Web Advanced Nathan Madimba.
        </p>
      </footer>

      <div id="modal" class="verborgen">
        <div id="modal-inhoud">
          <button id="modal-sluit" type="button">Sluiten</button>
          <div id="modal-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
